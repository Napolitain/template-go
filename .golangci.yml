version: "2"

linters:
    default: standard
    enable:
        - bodyclose
        - cyclop
        - errorlint
        - gocognit
        - gocritic
        - misspell
        - modernize
        - nolintlint
        - perfsprint
        - revive
        - unconvert
        - usestdlibvars
        - usetesting
    settings:
        cyclop:
            max-complexity: 10
        gocognit:
            min-complexity: 15

formatters:
    enable:
        - gofumpt
        - goimports
    settings:
        gofumpt:
            extra:
                group-params: true
                clothe-returns: true
                balance-calls: true

issues:
    fix: true
