name: Mutation

on:
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * 1"

jobs:
    gremlins:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: go.mod

            - uses: j178/prek-action@v3.0.0
              with:
                  extra-args: --all-files --hook-stage manual gremlins
