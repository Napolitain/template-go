minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "fix-byte-order-marker" },
    { id = "pretty-format-json", args = ["--autofix", "--no-sort-keys", "--indent", "4"] },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

# pre-commit: fixers first (by priority), then checks

[[repos.hooks]]
id = "go-mod-tidy"
name = "go mod tidy"
language = "system"
entry = "go mod tidy"
files = '(\.go|go\.mod|go\.sum)$'
pass_filenames = false
stages = ["pre-commit"]
priority = 10

[[repos.hooks]]
id = "go-fix"
name = "go fix"
language = "system"
entry = "go fix ./..."
types = ["go"]
pass_filenames = false
stages = ["pre-commit"]
priority = 20

[[repos.hooks]]
id = "gofumpt"
name = "gofumpt"
language = "system"
entry = "go tool gofumpt -extra -w"
types = ["go"]
stages = ["pre-commit"]
priority = 30

[[repos.hooks]]
id = "go-vet"
name = "go vet"
language = "system"
entry = "go vet ./..."
types = ["go"]
pass_filenames = false
stages = ["pre-commit", "pre-push"]
priority = 40

# pre-push

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
language = "system"
entry = "golangci-lint run --fix ./..."
types = ["go"]
pass_filenames = false
stages = ["pre-push"]
priority = 10

[[repos.hooks]]
id = "gofumpt-push"
name = "gofumpt"
language = "system"
entry = "go tool gofumpt -extra -w"
types = ["go"]
stages = ["pre-push"]
priority = 20

[[repos.hooks]]
id = "deadcode"
name = "deadcode"
language = "system"
entry = "sh -c 'out=$(go tool deadcode -test ./...) && [ -z \"$out\" ] || { echo \"$out\"; exit 1; }'"
types = ["go"]
pass_filenames = false
stages = ["pre-push"]
priority = 40

[[repos.hooks]]
id = "go-test"
name = "go test + coverage (internal/..., min 80%)"
language = "system"
entry = '''sh -c 'go test -race -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | awk -v min=80 "/^total:/ { print; if (\$3 + 0 < min) { print \"coverage below \" min \"%\"; exit 1 } }"' '''
types = ["go"]
pass_filenames = false
stages = ["pre-push"]
priority = 50

# manual: prek run --hook-stage manual gremlins --all-files
# gremlins ignores --threshold-efficacy (always exits 0), so gate on its JSON report.

[[repos.hooks]]
id = "gremlins"
name = "gremlins (mutation testing)"
language = "system"
entry = '''sh -c 'go tool gremlins unleash --output gremlins.json && grep -q "\"mutants_lived\":0," gremlins.json || { echo "surviving mutants: see LIVED above"; exit 1; }' '''
types = ["go"]
pass_filenames = false
stages = ["manual"]
